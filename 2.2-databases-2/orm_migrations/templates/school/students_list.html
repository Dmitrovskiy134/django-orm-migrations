<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список учеников</title>
    <!-- Подключаем Bootstrap для красоты (как в оригинале) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Список учеников школы</h1>
        
        {% for student in object_list %}
            <div class="card mb-3">
                <div class="card-header">
                    <strong>{{ student.name }}</strong> ({{ student.group }} класс)
                </div>
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Учителя:</h6>
                    <ul class="list-group list-group-flush">
                        {% for teacher in student.teachers.all %}
                            <li class="list-group-item">
                                {{ teacher.name }} — <em>{{ teacher.subject }}</em>
                            </li>
                        {% empty %}
                            <li class="list-group-item text-muted">У ученика пока нет учителей</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
